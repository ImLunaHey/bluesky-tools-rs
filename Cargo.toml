[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImLunaHey/bluesky-tools-rs"
authors = ["Luna <https://github.com/ImLunaHey>"]

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
http = "1.3.1"
regex = "1.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
url = { version = "2.5.4", features = ["serde"] }
unicode-segmentation = "1.12.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
